<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent 智能平台</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- 登录页 -->
<div id="loginPage" class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">
                <i class="fa-solid fa-robot"></i>
            </div>
            <h1>AI Agent 智能平台</h1>
            <p>多智能体协作 · 长期记忆 · 本地化部署</p>
        </div>
        <div class="login-form">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input id="username" type="text" value="admin" placeholder="请输入用户名">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input id="password" type="password" value="admin123456" placeholder="请输入密码">
            </div>
            <button class="btn-login" onclick="login()">
                <i class="fa-solid fa-right-to-bracket"></i>
                登录
            </button>
        </div>
    </div>
</div>

<!-- 主页面 -->
<div id="mainPage" class="main-wrapper">
    <!-- 左侧导航 -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fa-solid fa-robot"></i>
            </div>
            <span>AI Agent</span>
        </div>
        
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-tab="task" onclick="switchTab('task'); return false;">
                <i class="fa-solid fa-terminal"></i>
                <span>任务执行</span>
            </a>
            <a href="#" class="nav-item" data-tab="memory" onclick="switchTab('memory'); return false;">
                <i class="fa-solid fa-brain"></i>
                <span>知识库</span>
            </a>
            <a href="#" class="nav-item" data-tab="history" onclick="switchTab('history'); return false;">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>历史记录</span>
            </a>
        </nav>
        
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">A</div>
                <div class="user-detail">
                    <span class="user-name">Admin</span>
                    <span class="user-status">在线</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- 主内容 -->
    <main class="main-content">
        <!-- 任务执行页面 -->
        <div id="tab-task" class="content-tab active">
            <div class="page-header">
                <h2><i class="fa-solid fa-play"></i> 智能任务执行</h2>
                <p>输入您的需求，AI 多智能体将协同完成</p>
            </div>

            <div class="task-container">
                <div class="task-panel">
                    <div class="panel-title">
                        <i class="fa-solid fa-pen"></i>
                        任务输入
                    </div>
                    <textarea id="taskInput" class="task-input" placeholder="请输入你的任务...
例如：
• 帮我写一首关于春天的诗
• 分析这份销售数据报告
• 写一个Python爬虫程序
• 制定一份项目计划书"></textarea>
                    <div class="task-footer">
                        <button class="btn-primary" onclick="runTask()">
                            <i class="fa-solid fa-play"></i>
                            运行任务
                        </button>
                        <button class="btn-ghost" onclick="clearAll()">
                            <i class="fa-solid fa-eraser"></i>
                            清空
                        </button>
                    </div>
                </div>

                <div class="task-panel">
                    <div class="panel-title">
                        <i class="fa-solid fa-microchip"></i>
                        执行状态
                        <span class="status-tag" id="statusIndicator">
                            <span class="status-dot"></span>
                            等待中
                        </span>
                    </div>
                    <div id="log" class="console-output"></div>
                </div>

                <div class="task-panel result-panel">
                    <div class="panel-title">
                        <i class="fa-solid fa-file-lines"></i>
                        执行结果
                    </div>
                    <div id="reportArea" class="result-output"></div>
                </div>
            </div>
        </div>

        <!-- 知识库页面 -->
        <div id="tab-memory" class="content-tab">
            <div class="page-header">
                <h2><i class="fa-solid fa-database"></i> 知识库管理</h2>
                <p>管理长期记忆与知识文档</p>
            </div>

            <div class="memory-grid">
                <div class="stats-cards">
                    <div class="stat-card">
                        <div class="stat-icon blue">
                            <i class="fa-solid fa-layer-group"></i>
                        </div>
                        <div class="stat-num" id="statTotal">0</div>
                        <div class="stat-label">记忆总数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">
                            <i class="fa-solid fa-list-check"></i>
                        </div>
                        <div class="stat-num" id="statTask">0</div>
                        <div class="stat-label">任务记录</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon purple">
                            <i class="fa-solid fa-book"></i>
                        </div>
                        <div class="stat-num" id="statKnowledge">0</div>
                        <div class="stat-label">知识库</div>
                    </div>
                </div>

                <div class="memory-row">
                    <div class="memory-card">
                        <div class="card-title">
                            <i class="fa-solid fa-plus"></i>
                            添加记忆
                        </div>
                        <div class="card-body">
                            <div class="form-item">
                                <label>记忆类型</label>
                                <select id="memoryType" class="form-select">
                                    <option value="general">一般记忆</option>
                                    <option value="task">任务记录</option>
                                    <option value="preference">用户偏好</option>
                                    <option value="knowledge">知识库</option>
                                </select>
                            </div>
                            <div class="form-item">
                                <label>记忆内容</label>
                                <textarea id="memoryContent" class="form-textarea" placeholder="输入要保存的记忆内容..."></textarea>
                            </div>
                            <button class="btn-primary btn-full" onclick="addMemory()">
                                <i class="fa-solid fa-save"></i>
                                保存记忆
                            </button>
                        </div>
                    </div>

                    <div class="memory-card">
                        <div class="card-title">
                            <i class="fa-solid fa-upload"></i>
                            上传文档
                        </div>
                        <div class="card-body">
                            <div class="upload-zone" onclick="document.getElementById('kbFileInput').click()">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <p>点击上传文件</p>
                                <span>PDF / TXT / DOCX</span>
                                <input type="file" id="kbFileInput" accept=".pdf,.txt,.docx" style="display:none" onchange="uploadKbFile()">
                            </div>
                            <div id="uploadStatus" class="upload-status"></div>
                            <div id="uploadProgress" class="upload-progress">
                                <div id="progressBar" style="height: 12px; background: #e0e0e0; border-radius: 6px; overflow: hidden;">
                                    <div id="progressFill" style="height: 100%; background: linear-gradient(90deg, #3ea6ff, #64b5f6); border-radius: 6px; transition: width 0.3s ease; width: 0%;"></div>
                                </div>
                                <div id="progressText" style="margin-top: 8px; font-size: 13px; color: #606060; text-align: center;">0%</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="memory-row">
                    <div class="memory-card flex-2">
                        <div class="card-title">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            搜索记忆
                        </div>
                        <div class="card-body">
                            <div class="search-row">
                                <input type="text" id="searchQuery" class="search-input" placeholder="输入关键词搜索...">
                                <button class="btn-search" onclick="searchMemories()">
                                    <i class="fa-solid fa-search"></i>
                                </button>
                            </div>
                            <div id="searchResults" class="memory-list"></div>
                        </div>
                    </div>
                </div>

                <div class="memory-card flex-2">
                    <div class="card-title">
                        <i class="fa-solid fa-list"></i>
                        全部记忆
                        <button class="btn-icon" onclick="loadMemories()" title="刷新">
                            <i class="fa-solid fa-rotate"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="memoryList" class="memory-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 历史记录页面 -->
        <div id="tab-history" class="content-tab">
            <div class="page-header">
                <h2><i class="fa-solid fa-clock-rotate-left"></i> 历史记录</h2>
                <p>查看历史任务执行记录</p>
            </div>
            <div class="empty-state">
                <i class="fa-solid fa-clock"></i>
                <p>历史记录功能开发中...</p>
            </div>
        </div>
    </main>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
