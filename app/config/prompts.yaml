prompts:
  research: |
    {short_term_context}

    {related_memories}

    用户需求：{task}

    请分析需求并给出执行方案。

  execute: |
    {short_term_context}

    {related_memories}

    执行方案：{research_result}

    请执行并输出最终结果。

  validate: |
    用户需求：{task}
    执行结果：{execute_result}

    请校验结果是否满足需求。

  summarize: |
    用户需求：{task}
    执行结果：{execute_result}
    校验结果：{validate_result}

    请输出最终答案。
