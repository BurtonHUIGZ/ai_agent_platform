prompts:
  route: |
    用户输入：{task}
    
    请分析用户意图和任务复杂度，直接返回 JSON 格式的路由决策。
    示例格式：{{"task_type": "chat", "reason": "判断理由", "need_memory": true, "skip_research": false, "skip_validate": false, "skip_summary": false, "agent_level": "expert", "response_style": "detailed"}}
    
    请按上方JSON格式返回，不要有其他内容。
    
    任务类型（默认使用 plan_execute）：
    - plan_execute: 需要多个步骤执行的任务
    - chat: 闲聊、问候
    - simple: 简单明确任务
    - question: 问答、查询
    - complex: 复杂任务

  plan: |
    {short_term_context}

    {related_memories}

    用户需求：{task}

    请分析需求，生成详细的执行步骤计划。要求：
    1. 使用 Markdown 格式列出步骤
    2. 每个步骤描述要具体、可执行
    3. 如果需要工具或信息，明确标注
    4. 步骤数量控制在3-5个

  execute_plan: |
    {short_term_context}

    {related_memories}

    执行计划：{plan}

    请严格按照上述计划依次执行每个步骤，并输出最终结果。

  route_question: |
    用户问题：{task}
    
    你是一个投票决策专家。需要从以下3个方案中选择最优答案：
    1. 知识库检索结果：{rag_result}
    2. 网络搜索结果：{web_result}
    3. 直接回答：{direct_result}
    
    请从准确性、相关性、完整性三个维度评估每个方案，然后投票选择最优方案。
    返回格式：
    {{
      "winner": "rag" | "web" | "direct",
      "reason": "选择理由",
      "confidence": 0.0-1.0
    }}

  research: |
    {short_term_context}

    {related_memories}

    用户需求：{task}

    请分析需求并给出执行方案。如需补充信息可合理推断。

  execute: |
    {short_term_context}

    {related_memories}

    执行方案：{research_result}

    请执行并输出最终结果。

  validate: |
    用户需求：{task}
    执行结果：{execute_result}

    请校验结果是否满足需求，给出反馈。

  summarize: |
    用户需求：{task}
    执行结果：{execute_result}
    校验结果：{validate_result}

    请整合输出最终答案。

  # 防幻觉提示词
  anti_hallucination_citation: |
    【严格】回答规则：
    1. 只使用上述提供的记忆内容回答，禁止添加任何外部知识
    2. 如果记忆中没有相关信息，必须明确回答"我不知道"或"信息不足"
    3. 绝对禁止编造事实、数字、日期、名称等
    4. 对不确定的内容，使用"可能"、"不确定"等措辞
    5. 如需引用记忆，使用 [来源X] 格式标注

  anti_hallucination_faithfulness: |
    分析以下回答是否基于提供的上下文。找出：
    1. 有上下文支持的陈述
    2. 缺乏上下文支持的陈述（可能是幻觉）

    上下文：
    {context}

    回答：
    {response}

    请用以下格式返回：
    支持陈述: <陈述1>; <陈述2>; ...
    不支持陈述: <陈述1>; <陈述2>; ...
    可信度: 0-100的数值

    如果回答没有提供实质性内容，可信度设为0。

  anti_hallucination_fact_check: |
    核查以下回答中的事实是否与参考资料一致。
    如果发现不一致或无法验证的内容，标记为问题。

    参考资料：
    {doc_contents}

    回答：
    {response}

    请返回：
    1. 一致的陈述: <陈述>
    2. 不一致或无法验证的陈述: <陈述>
    3. 整体评估: 通过/有疑问/不通过
