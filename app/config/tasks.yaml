tasks:
  route_task:
    role_zh: "🎯 智能路由"
    start_msg: "分析任务意图..."
    expected_output: "JSON 格式路由决策"
    agent: router
    prompt_key: route

  research_task:
    role_zh: "🔍 智能需求分析师"
    start_msg: "开始分析用户需求..."
    expected_output: "清晰的需求理解与可执行方案，中文"
    agent: researcher
    prompt_key: research

  execute_task:
    role_zh: "⚙️ 全能任务执行者"
    start_msg: "开始执行任务..."
    expected_output: "直接输出最终结果，中文"
    agent: executor
    prompt_key: execute

  validate_task:
    role_zh: "🧪 结果质量校验师"
    start_msg: "开始校验..."
    expected_output: "中文校验报告"
    agent: validator
    prompt_key: validate

  summarize_task:
    role_zh: "📋 最终报告汇总师"
    start_msg: "开始汇总最终报告..."
    expected_output: "最终答案，纯中文，直接可用"
    agent: manager
    prompt_key: summarize
